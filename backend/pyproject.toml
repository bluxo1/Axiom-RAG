[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "axiom-backend"
description = "Axiom — citation-grounded RAG agent (backend)"
dynamic = ["version"]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "PyYAML>=6.0,<7.0",
  "python-multipart>=0.0.18,<1.0",       # multipart upload parsing (POST /documents)
  # ─── Persistence (Design.md §2.2) ───────────────────────────────────────────
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",           # DATABASE_URL uses postgresql+psycopg://
  # ─── RAG glue (Architecture.md §5: LlamaIndex for ingestion + retrieval) ─────
  "llama-index-core>=0.14,<0.15",
  "llama-index-embeddings-openai>=0.6,<0.8",
  "llama-index-llms-openai>=0.7,<0.9",
  # ADR-0003: OpenAI-compatible endpoints (e.g. Google's Gemini compatibility
  # layer) — model names outside OpenAI's catalog need the OpenAILike classes.
  "llama-index-embeddings-openai-like>=0.4,<0.5",
  "llama-index-llms-openai-like>=0.8,<0.9",
  "tiktoken>=0.8,<1.0",                  # token-based chunking (512/64)
  # ─── Parsing (Architecture.md §3.1) ─────────────────────────────────────────
  "pypdf>=5.1,<7.0",                     # PDF text extraction
  "trafilatura>=2.0,<3.0",               # URL main-content extraction
  "dnspython>=2.8,<3.0",                  # DNS lookups with enforceable timeouts for URL ingestion
  # ─── Web-search fallback (Architecture.md §3.6, Design.md §1.2) ──────────────
  "httpx>=0.27,<1.0",                    # Tavily/Brave REST calls
]

[project.optional-dependencies]
# Chroma is the local-development vector store. Production uses pgvector and
# deliberately omits this extra (and the vulnerable Chroma server dependency).
chroma = [
  "llama-index-vector-stores-chroma>=0.6,<0.7",
  "chromadb>=1.5,<2.0",                  # client; server pinned in docker-compose
]
dev = [
  # Keep the README/CI `pip install -e ".[dev]"` workflow self-contained.
  "llama-index-vector-stores-chroma>=0.6,<0.7",
  "chromadb>=1.5,<2.0",
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<2.0",
  "bandit>=1.9,<2.0",
  "pip-audit>=2.10,<3.0",
  # 9.0.3 fixes PYSEC-2026-1845 (unsafe shared tmpdir handling on Unix).
  "pytest>=9.0.3,<10.0",
  # `starlette.testclient` imports `httpx2` and warns (deprecation) if it has to
  # fall back to `httpx`. `filterwarnings = ["error"]` turns that warning into a
  # collection failure, so the test client's own preferred package is pinned.
  "httpx2>=2.13,<3.0",
  "types-PyYAML>=6.0,<7.0",
]
# Live-eval only (EVAL.md §3): RAGAS faithfulness / answer-relevancy scoring
# needs a judge model and is imported lazily behind `pytest evals/ --run-llm`,
# so CI never installs it and the offline eval run has no extra dependencies.
eval = [
  "ragas>=0.2,<0.3",
]

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── Lint / format (Rules.md §2: no lint warnings merged) ─────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "PTH",  # use pathlib
  "PT",   # pytest style
  "TID",  # tidy imports
  "ARG",  # unused arguments
  "RUF",  # ruff-specific
  "ANN",  # missing annotations
  "S110", # try-except-pass      (Rules.md §6: `except: pass` is banned)
  "S112", # try-except-continue  (same rule, loop form)
]

[tool.ruff.lint.per-file-ignores]
# ARG001/ARG002: fixtures and provider test doubles take arguments they don't
# use (a framework passes them, or a Protocol requires the signature).
"tests/*" = ["ARG001", "ARG002"]
"evals/*" = ["ARG001", "ARG002"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# ─── Type checking (Rules.md §2: mypy strict) ─────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_configs = true
files = ["app", "tests", "evals"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Third-party libraries without usable type information for a 3.11 target.
# `follow_imports = "skip"` stops mypy analyzing their internals — notably
# numpy (pulled in by chromadb and tiktoken), whose 3.12-only `type` statements
# in its stubs fail to parse under python_version 3.11. Our own code stays
# fully strict.
[[tool.mypy.overrides]]
module = [
  "llama_index.*",
  "chromadb",
  "trafilatura",
  "dns",
  "dns.*",
  "pypdf",
  "pypdf.*",
  "tiktoken",
  "tiktoken.*",
  "numpy",
  "numpy.*",
  # Live-eval only: the `eval` extra, not installed in CI (see evals/ragas_runner.py).
  "ragas",
  "ragas.*",
  "datasets",
  "langchain_openai",
  "langchain_openai.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

# ─── Tests ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
  # Our own warnings are bugs: fail on them.
  "error",
  # Upstream only: starlette 1.6.0 still uses the `anyio.abc.BlockingPortal`
  # alias that anyio 4.15 deprecated, and it fires when `starlette.testclient`
  # is imported. Nothing in `app/` can avoid it. Drop this line once starlette
  # moves to `anyio.from_thread.BlockingPortal`.
  'ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning',
]
