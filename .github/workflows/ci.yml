name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; a new push cancels the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend: lint, typecheck, tests (CLAUDE.md: all three before a phase) ──
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install (editable, with dev extras)
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Pytest
        run: pytest

  # ─── Frontend: pinned toolchain, assertion, build (Phase 0 exit) ────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Assert pinned toolchain
        run: pnpm run assert:toolchain

      - name: Build
        run: pnpm run build

  # ─── Compose: the Phase 0 exit criterion, executed ──────────────────────────
  # `docker compose up` boots all services and `/health` returns 200. This job
  # is the only place that criterion runs, so it is not skipped.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seed .env from the documented example
        run: cp .env.example .env

      - name: Boot the stack and wait for health
        run: docker compose up --build --wait --wait-timeout 180

      - name: Assert /health returns 200
        run: |
          code=$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8000/health)
          echo "GET /health -> $code"
          test "$code" = "200"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
